name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot
        run: |
          set -euo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -o godot.zip
          mkdir -p "$HOME/.local/bin"
          install -m 0755 Godot_v4.7.1-stable_linux.x86_64 "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download export templates
        run: |
          set -euo pipefail
          curl -L -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          unzip -o templates.tpz
          cp -r templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"

      - name: Import and export Godot Web
        run: |
          set -euo pipefail
          mkdir -p web/public/godot
          godot --headless --path godot --import
          godot --headless --path godot --export-release Web ../web/public/godot/index.html
          gzip -9 -c web/public/godot/index.wasm > web/public/godot/index.wasm.gz
          gzip -9 -c web/public/godot/index.pck > web/public/godot/index.pck.gz
          rm -f web/public/godot/index.wasm web/public/godot/index.pck

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web
        working-directory: web
        run: npm ci && npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
